[project]
name = "analytics-marketplace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram",
    "confluent-kafka",
    "fastapi",
    "httpx",
    "jinja2",
    "oracledb",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "redis",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
